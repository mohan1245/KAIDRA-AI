<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaidra AI Website Agent — Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f0f2f8;
           display: flex; justify-content: center; align-items: center;
           min-height: 100vh; }
    #chat { width: 400px; height: 640px; background: white; border-radius: 16px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.15); display: flex;
            flex-direction: column; overflow: hidden; }
    #header { background: #6366f1; color: white; padding: 14px 20px;
               display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    #header-text h2 { font-size: 16px; font-weight: 700; }
    #header-text p  { font-size: 12px; opacity: 0.8; margin-top: 2px; }
    #language-select { font-size: 12px; padding: 5px 6px; border-radius: 6px;
               border: none; background: rgba(255,255,255,0.15); color: white; }
    #language-select option { color: #111; }
    #messages { flex: 1; overflow-y: auto; padding: 16px;
                display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px;
           font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
    .msg.user { background: #6366f1; color: white; align-self: flex-end;
                border-bottom-right-radius: 4px; }
    .msg.bot  { background: #f0f2f8; color: #333; align-self: flex-start;
                border-bottom-left-radius: 4px; }
    .msg.bot.thinking { opacity: 0.5; font-style: italic; }
    #input-row { display: flex; gap: 8px; padding: 12px 14px;
                 border-top: 1px solid #eee; align-items: center; }
    #input { flex: 1; border: 1px solid #ddd; border-radius: 8px;
             padding: 10px 14px; font-size: 14px; outline: none; }
    #input:focus { border-color: #6366f1; }
    #mic { background: #f0f2f8; border: 1px solid #ddd; border-radius: 8px;
           width: 40px; height: 40px; cursor: pointer; font-size: 16px;
           display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    #mic.listening { background: #ef4444; border-color: #ef4444; color: white; }
    #mic:disabled { opacity: 0.4; cursor: not-allowed; }
    #send { background: #6366f1; color: white; border: none; border-radius: 8px;
            padding: 10px 18px; cursor: pointer; font-weight: 700; font-size: 14px; flex-shrink: 0; }
    #send:hover { background: #4f46e5; }
    #mic-status { font-size: 11px; color: #999; padding: 0 14px 8px; min-height: 14px; }
  </style>
</head>
<body>
  <div id="chat">
    <div id="header">
      <div id="header-text">
        <h2>Kai — Kaidra AI Assistant</h2>
        <p>Ask me anything about Kaidra</p>
      </div>
      <select id="language-select" title="Reply language / mic language">
        <option value="en-US" data-name="English">🇬🇧 English</option>
        <option value="hi-IN" data-name="Hindi">🇮🇳 हिंदी</option>
        <option value="ta-IN" data-name="Tamil">🇮🇳 தமிழ்</option>
        <option value="te-IN" data-name="Telugu">🇮🇳 తెలుగు</option>
        <option value="es-ES" data-name="Spanish">🇪🇸 Español</option>
        <option value="fr-FR" data-name="French">🇫🇷 Français</option>
        <option value="de-DE" data-name="German">🇩🇪 Deutsch</option>
        <option value="zh-CN" data-name="Chinese">🇨🇳 中文</option>
        <option value="ar-SA" data-name="Arabic">🇸🇦 العربية</option>
        <option value="pt-BR" data-name="Portuguese">🇧🇷 Português</option>
        <option value="ja-JP" data-name="Japanese">🇯🇵 日本語</option>
      </select>
    </div>
    <div id="messages">
      <div class="msg bot">Hi! I'm Kai, Kaidra AI's assistant. How can I help you today?</div>
    </div>
    <div id="mic-status"></div>
    <div id="input-row">
      <button id="mic" title="Speak your message">🎤</button>
      <input id="input" type="text" placeholder="Type a message..." />
      <button id="send">Send</button>
    </div>
  </div>

  <script>
    const API = '/api/website-agent/chat';
    // Generate a unique session ID for this browser tab
    const sessionId = 'session-' + Math.random().toString(36).substr(2, 9);

    const msgList = document.getElementById('messages');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const micBtn = document.getElementById('mic');
    const micStatus = document.getElementById('mic-status');
    const languageSelect = document.getElementById('language-select');

    function addMsg(text, role) {
      const d = document.createElement('div');
      d.className = 'msg ' + role;
      d.textContent = text;
      msgList.appendChild(d);
      msgList.scrollTop = msgList.scrollHeight;
      return d;
    }

    function currentLanguageName() {
      const opt = languageSelect.options[languageSelect.selectedIndex];
      return opt.dataset.name;
    }

    async function send(overrideText) {
      const msg = (overrideText ?? input.value).trim();
      if (!msg) return;
      input.value = '';
      addMsg(msg, 'user');

      const thinking = addMsg('Thinking...', 'bot thinking');

      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            session_id: sessionId,
            message: msg,
            language: currentLanguageName() // e.g. "Hindi" — tells the agent which language to reply in
          }),
        });
        const data = await res.json();
        thinking.textContent = data.reply;
        thinking.className = 'msg bot';
      } catch {
        thinking.textContent = 'Error connecting to server. Is it running?';
      }
    }

    sendBtn.addEventListener('click', () => send());
    input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

    // --- Voice input (Web Speech API) ---------------------------------
    // Supported in Chrome/Edge; not supported in Firefox, partial in Safari.
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      micBtn.disabled = true;
      micBtn.title = 'Voice input is not supported in this browser — try Chrome or Edge';
    } else {
      const recognition = new SpeechRecognition();
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      let listening = false;

      micBtn.addEventListener('click', () => {
        if (listening) {
          recognition.stop();
          return;
        }
        recognition.lang = languageSelect.value; // matches selected language
        recognition.start();
      });

      recognition.addEventListener('start', () => {
        listening = true;
        micBtn.classList.add('listening');
        micStatus.textContent = 'Listening… speak now';
      });

      recognition.addEventListener('end', () => {
        listening = false;
        micBtn.classList.remove('listening');
        micStatus.textContent = '';
      });

      recognition.addEventListener('result', (event) => {
        const transcript = event.results[0][0].transcript;
        input.value = transcript;
        send(transcript);
      });

      recognition.addEventListener('error', (event) => {
        micStatus.textContent = 'Mic error: ' + event.error;
      });
    }
  </script>
</body>
</html>
